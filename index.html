<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Data System</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SheetJS (Excel Export) Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f2f5;
      padding: 20px;
    }
    #mainApp {
      display: none;
    }
    
    .container, .modal-content {
      position: relative;
      overflow: hidden;
    }

    .container::before, .modal-content::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background-image: url('background.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.10;
      pointer-events: none;
      z-index: 0;
    }

    .container *, .modal-content * {
      position: relative;
      z-index: 1;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 15px;
    }
    .logo {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }
    h2 {
      color: #1a73e8;
      font-size: 22px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: #e4e6eb;
      color: #333;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #1a73e8;
      color: white;
    }
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .form-group-checkbox {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-group-checkbox label {
      margin-bottom: 0;
      cursor: pointer;
    }
    .form-group-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="text"], input[type="password"], input[type="date"], input[type="tel"], input[type="number"], select, textarea {
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      background-color: rgba(255, 255, 255, 0.9);
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 5px rgba(26, 115, 232, 0.3);
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
      width: 100%;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .btn-export {
      background-color: #17a2b8;
      color: white;
    }
    .btn-export:hover {
      background-color: #138496;
    }
    .btn-excel {
      background-color: #28a745;
      color: white;
    }
    .btn-excel:hover {
      background-color: #218838;
    }
    .btn-warning {
      background-color: #ffc107;
      color: #212529;
      padding: 5px 10px;
      font-size: 12px;
      margin-right: 5px;
    }
    .btn-warning:hover {
      background-color: #e0a800;
    }
    .btn-danger {
      background-color: #dc3545;
      color: white;
      padding: 5px 10px;
      font-size: 12px;
    }
    .btn-danger:hover {
      background-color: #c82333;
    }
    .header-buttons {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .search-input {
      width: 100%;
      margin-bottom: 15px;
    }

    /* Grid Kartu Segi Empat */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }
    .student-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }
    .student-card.visible {
      display: flex;
    }
    .card-header-info {
      display: flex;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .photo-2x2 {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #1a73e8;
      background: #f0f0f0;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .photo-2x2:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .card-title {
      flex: 1;
    }
    .card-title h3 {
      font-size: 16px;
      color: #1a73e8;
      margin-bottom: 6px;
    }
    .card-title p {
      font-size: 12px;
      color: #444;
      margin-bottom: 3px;
    }
    .card-details {
      font-size: 12px;
      color: #444;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      border-top: 1px solid #f0f2f5;
      padding-top: 10px;
    }

    /* Status Checklist Styling */
    .status-checked {
      color: #28a745;
      font-weight: bold;
    }
    .status-unchecked {
      color: #dc3545;
      font-weight: bold;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    #loginModal {
      display: flex;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      z-index: 9999;
    }
    /* Modal Pratinjau Foto Full */
    #imageViewerModal .modal-content {
      background: transparent;
      box-shadow: none;
      text-align: center;
      max-width: 90vw;
      max-height: 90vh;
      padding: 0;
    }
    #imageViewerModal img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      border: 3px solid #ffffff;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    .search-notice {
      grid-column: 1/-1;
      text-align: center;
      padding: 30px 10px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- SECURITY LOGIN MODAL -->

    <div class="modal-content" style="max-width: 380px; text-align: center;">
      <img src="background.png" alt="Logo" class="logo" style="margin-bottom: 10px;" onerror="this.src='https://via.placeholder.com/75?text=Logo'">
      <h3 style="margin-bottom: 5px; color: #1a73e8;">Security Login</h3>

  <!-- MAIN APPLICATION -->

        <div class="form-group">

        </div>
        <div class="form-group">

            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>

        </div>
        <div class="form-group">
          <label for="address">Address (Barangay in Maluso):</label>

            <option value="Gaunan North(Zone I)">Gaunan North(Zone I)</option>
            <option value="Gaunan South(Zone II)">Gaunan South(Zone II)</option>
            <option value="Limbubong">Limbubong</option>
            <option value="Mahayahay Lower (Zone I)">Mahayahay Lower (Zone I)</option>
            <option value="Mahayahay Upper (Zone II)">Mahayahay Upper (Zone II)</option>
            <option value="Muslim Area">Muslim Area</option>
            <option value="Port Holland Zone I Poblacion (Upper)">Port Holland Zone I Poblacion (Upper)</option>
            <option value="Port Holland Zone II Poblacion (Shipyard Main)">Port Holland Zone II Poblacion (Shipyard Main)</option>
            <option value="Port Holland Zone III Poblacion (Samal Village)">Port Holland Zone III Poblacion (Samal Village)</option>
            <option value="Port Holland Zone IV (Lower)">Port Holland Zone IV (Lower)</option>
            <option value="Port Holland Zone V (Shipyard Tabuk)">Port Holland Zone V (Shipyard Tabuk)</option>
            <option value="Taberlongan">Taberlongan</option>
            <option value="Tamuk">Tamuk</option>
            <option value="Townsite (Poblacion)">Townsite (Poblacion)</option>
            <option value="Tubigan">Tubigan</option>
            <option value="Upper Garlayan">Upper Garlayan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="enrollment">Enrollment Fee</label>
          <input type="number" id="enrollment" name="enrollment" placeholder="Enter amount" required>
        </div>
        <div class="form-group">
          <label for="balance">Balance</label>

    <!-- SECTION 2: Card Data -->

  </div>

  <!-- EDIT DATA MODAL POPUP -->

        <div class="form-group">

        </div>
        <div class="form-group">
          <label for="editDob">Date of Birth</label>
          <input type="date" id="editDob" required>
        </div>
        <div class="form-group">
          <label for="editContact">Contact Number</label>
          <input type="tel" id="editContact" required>
        </div>
        <div class="form-group">
          <label for="editGrade">Grade / Class</label>
          <select id="editGrade" required>
            <option value="Grade 0">Grade 0</option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>

  <!-- MODAL VIEW PHOTO FULLSIZE -->
  <div id="imageViewerModal" class="modal" onclick="closeImageViewer()">

      <img id="fullImage" src="" alt="Full Photo Student">
      <p style="color: white; margin-top: 10px; font-size: 13px;">Click anywhere to close</p>
    </div>
  </div>

  <script>
    /*
      ===========================
      SUPABASE CONFIGURATION
      ===========================
      Replace these two values with:
      Supabase Dashboard -> Project Settings -> API
      Project URL and Publishable/Anon Key.
    */
    const SUPABASE_URL = "https://lxygingezwbjdnjudvmj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_BDLPk1-YB9PPq7gqgEdCIw_IMESdReU";

    const supabaseConfigured =
      SUPABASE_URL.startsWith("https://") &&
      SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";

    const supabaseClient = supabaseConfigured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    let studentsCache = [];

    function checkLogin(event) {
      event.preventDefault();
      const user = document.getElementById("loginUsername").value.trim();
      const pass = document.getElementById("loginPassword").value.trim();

      if (user === "KUN" && pass === "4444") {
        sessionStorage.setItem("isLoggedIn", "true");
        document.getElementById("loginModal").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        loadStudents();
      } else {
        alert("Incorrect Username or Password! Access denied.");
      }
    }

    function logout() {
      sessionStorage.removeItem("isLoggedIn");
      location.reload();
    }

    function getLocalData() {
      try {
        return JSON.parse(localStorage.getItem("studentDatabase")) || [];
      } catch {
        return [];
      }
    }

    function setLocalData(data) {
      localStorage.setItem("studentDatabase", JSON.stringify(data));
    }

    async function loadStudents() {
      if (!supabaseClient) {
        studentsCache = getLocalData();
        renderCards();
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from("students")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        studentsCache = data || [];
        renderCards();
      } catch (error) {
        console.error("Supabase load error:", error);
        alert("Hindi ma-load ang data mula sa Supabase. Suriin ang Supabase URL, key, table, at RLS policies.");
        studentsCache = getLocalData();
        renderCards();
      }
    }

    function handleImageUpload(event, mode) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Please select an image file.");
        event.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;

        img.onload = function() {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;

          const MAX_SIZE = 400;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = Math.round(width);
          canvas.height = Math.round(height);

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          let quality = 0.8;
          let base64String = canvas.toDataURL("image/jpeg", quality);

          while (base64String.length > 100 * 1024 && quality > 0.1) {
            quality -= 0.1;
            base64String = canvas.toDataURL("image/jpeg", quality);
          }

          if (mode === "entry") {
            document.getElementById("photoBase64").value = base64String;
            document.getElementById("photoPreview").innerHTML =
              `<img src="${base64String}" class="photo-2x2" alt="Photo preview">`;
          } else {
            document.getElementById("editPhotoBase64").value = base64String;
            document.getElementById("editPhotoPreview").innerHTML =
              `<img src="${base64String}" class="photo-2x2" alt="Photo preview">`;
          }
        };
      };

      reader.readAsDataURL(file);
    }

    function viewFullImage(src) {
      if (!src || src.includes("placeholder")) return;
      document.getElementById("fullImage").src = src;
      document.getElementById("imageViewerModal").style.display = "flex";
    }

    function closeImageViewer() {
      document.getElementById("imageViewerModal").style.display = "none";
    }

    function switchTab(tabName) {
      const entryTab = document.getElementById("entrySection");
      const tableTab = document.getElementById("tableSection");
      const buttons = document.querySelectorAll(".tab-btn");

      if (tabName === "entry") {
        entryTab.classList.add("active");
        tableTab.classList.remove("active");
        buttons[0].classList.add("active");
        buttons[1].classList.remove("active");
      } else {
        tableTab.classList.add("active");
        entryTab.classList.remove("active");
        buttons[1].classList.add("active");
        buttons[0].classList.remove("active");
        document.getElementById("searchName").value = "";
        renderCards();
      }
    }

    async function saveStudent(event) {
      event.preventDefault();

      const fullname = document.getElementById("fullname").value.trim();
      const dob = document.getElementById("dob").value;
      const contact = document.getElementById("contact").value.trim();
      const grade = document.getElementById("grade").value;
      const address = document.getElementById("address").value.trim();
      const enrollment = Number(document.getElementById("enrollment").value || 0);
      const balance = Number(document.getElementById("balance").value || 0);
      const scholar = document.getElementById("scholar").checked;
      const paid = document.getElementById("paid").checked;
      const photo = document.getElementById("photoBase64").value || null;

      const student = {
        fullname,
        dob,
        contact,
        grade,
        address,
        enrollment,
        balance,
        scholar,
        paid,
        photo
      };

      const submitButton = document.querySelector("#studentForm button[type='submit']");
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = "Saving...";
      }

      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from("students")
            .insert([student])
            .select()
            .single();

          if (error) throw error;

          studentsCache.unshift(data);
          setLocalData(studentsCache);

          alert("Student data successfully saved to Supabase.");
        } else {
          studentsCache = getLocalData();
          studentsCache.unshift({
            ...student,
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now()
          });
          setLocalData(studentsCache);

          alert("Supabase belum dikonfigurasi. Data sementara disimpan di perangkat.");
        }

        document.getElementById("studentForm").reset();
        document.getElementById("photoBase64").value = "";
        document.getElementById("photoPreview").innerHTML = "";
        switchTab("table");
        renderCards();
      } catch (error) {
        console.error("Supabase insert error:", error);
        alert("Gagal menyimpan ke Supabase: " + (error.message || error));
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "+ Submit Student Data";
        }
      }
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderCards() {
      const data = studentsCache || [];
      const container = document.getElementById("cardContainer");
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = `<div class="search-notice">No data available</div>`;
        return;
      }

      const notice = document.createElement("div");
      notice.id = "searchNotice";
      notice.className = "search-notice";
      notice.textContent =
        "Please type a student name in the search box above to display card.";
      container.appendChild(notice);

      data.forEach((student, index) => {
        const photoSrc = student.photo || "https://via.placeholder.com/85?text=No+Photo";

        const scholarValue =
          student.scholar === true || student.scholar === "YES";
        const paidValue =
          student.paid === true || student.paid === "Paid";

        const scholarDisplay = scholarValue
          ? `<span class="status-checked">✓ YES</span>`
          : `<span class="status-unchecked">✗ NO</span>`;

        const paidDisplay = paidValue
          ? `<span class="status-checked">✓ Paid</span>`
          : `<span class="status-unchecked">✗ NO</span>`;

        const card = document.createElement("div");
        card.className = "student-card";

        const safePhoto = escapeHTML(photoSrc);

        card.innerHTML = `
          <div>
            <div class="card-header-info">
              <img src="${safePhoto}" class="photo-2x2" alt="2x2 Photo"
                   title="Click to view photo"
                   onclick="viewFullImage(this.src)">
              <div class="card-title">
                <h3>${escapeHTML(student.fullname || "-")}</h3>
                <p><strong>Grade:</strong> ${escapeHTML(student.grade || "-")}</p>
                <p><strong>DOB:</strong> ${escapeHTML(student.dob || "-")}</p>
                <p><strong>Contact:</strong> ${escapeHTML(student.contact || "-")}</p>
                <p><strong>Address:</strong> ${escapeHTML(student.address || "-")}</p>
              </div>
            </div>
            <div class="card-details">
              <div><strong>Scholar:</strong> ${scholarDisplay}</div>
              <div><strong>Paid Status:</strong> ${paidDisplay}</div>
              <div><strong>Enrollment:</strong> ₱${Number(student.enrollment || 0).toLocaleString()}</div>
              <div><strong>Balance:</strong> ₱${Number(student.balance || 0).toLocaleString()}</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn btn-warning" onclick="openEditModal(${index})">Edit</button>
            <button class="btn btn-danger" onclick="deleteStudent(${index})">Delete</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function openEditModal(index) {
      const data = studentsCache || [];
      const student = data[index];

      if (!student) return;

      document.getElementById("editIndex").value = index;
      document.getElementById("editFullname").value = student.fullname || "";
      document.getElementById("editDob").value = student.dob || "";
      document.getElementById("editContact").value = student.contact || "";
      document.getElementById("editGrade").value = student.grade || "";
      document.getElementById("editAddress").value = student.address || "";
      document.getElementById("editEnrollment").value = student.enrollment ?? "";
      document.getElementById("editBalance").value = student.balance ?? "";

      document.getElementById("editScholar").checked =
        student.scholar === true || student.scholar === "YES";
      document.getElementById("editPaid").checked =
        student.paid === true || student.paid === "Paid";

      const photoSrc = student.photo || "";
      document.getElementById("editPhotoBase64").value = photoSrc;

      if (photoSrc) {
        document.getElementById("editPhotoPreview").innerHTML =
          `<img src="${escapeHTML(photoSrc)}" class="photo-2x2"
                onclick="viewFullImage(this.src)" alt="Photo">`;
      } else {
        document.getElementById("editPhotoPreview").innerHTML = "";
      }

      document.getElementById("editModal").style.display = "flex";
    }

    function closeEditModal() {
      document.getElementById("editModal").style.display = "none";
    }

    async function updateStudent(event) {
      event.preventDefault();

      const index = Number(document.getElementById("editIndex").value);
      const oldStudent = studentsCache[index];

      if (!oldStudent) return;

      const updatedStudent = {
        fullname: document.getElementById("editFullname").value.trim(),
        dob: document.getElementById("editDob").value,
        contact: document.getElementById("editContact").value.trim(),
        grade: document.getElementById("editGrade").value,
        address: document.getElementById("editAddress").value.trim(),
        enrollment: Number(document.getElementById("editEnrollment").value || 0),
        balance: Number(document.getElementById("editBalance").value || 0),
        scholar: document.getElementById("editScholar").checked,
        paid: document.getElementById("editPaid").checked,
        photo: document.getElementById("editPhotoBase64").value || null
      };

      try {
        if (supabaseClient) {
          if (!oldStudent.id) {
            throw new Error("Record does not have a Supabase ID.");
          }

          const { data, error } = await supabaseClient
            .from("students")
            .update(updatedStudent)
            .eq("id", oldStudent.id)
            .select()
            .single();

          if (error) throw error;

          studentsCache[index] = data;
          alert("Student data updated successfully in Supabase!");
        } else {
          studentsCache[index] = { ...oldStudent, ...updatedStudent };
          alert("Supabase belum dikonfigurasi. Data updated locally.");
        }

        setLocalData(studentsCache);
        closeEditModal();
        renderCards();
        filterCards();
      } catch (error) {
        console.error("Supabase update error:", error);
        alert("Gagal mengubah data: " + (error.message || error));
      }
    }

    async function deleteStudent(index) {
      if (!confirm("Are you sure you want to delete this record?")) return;

      const student = studentsCache[index];
      if (!student) return;

      try {
        if (supabaseClient) {
          if (!student.id) throw new Error("Record does not have a Supabase ID.");

          const { error } = await supabaseClient
            .from("students")
            .delete()
            .eq("id", student.id);

          if (error) throw error;
        }

        studentsCache.splice(index, 1);
        setLocalData(studentsCache);
        renderCards();
        filterCards();

        alert("Student data deleted successfully.");
      } catch (error) {
        console.error("Supabase delete error:", error);
        alert("Gagal menghapus data: " + (error.message || error));
      }
    }

    function filterCards() {
      const input = document.getElementById("searchName").value.trim().toUpperCase();
      const cards = document.querySelectorAll("#cardContainer .student-card");
      const notice = document.getElementById("searchNotice");

      if (input === "") {
        if (notice) notice.style.display = "block";
        cards.forEach(card => card.classList.remove("visible"));
        return;
      }

      if (notice) notice.style.display = "none";

      cards.forEach(card => {
        const nameText =
          card.querySelector(".card-title h3")?.textContent || "";

        if (nameText.toUpperCase().includes(input)) {
          card.classList.add("visible");
        } else {
          card.classList.remove("visible");
        }
      });
    }

    function getExportData() {
      return (studentsCache || []).map((item, index) => ({
        "No": index + 1,
        "Full Name": item.fullname || "",
        "Date of Birth": item.dob || "",
        "Contact No": item.contact || "",
        "Grade": item.grade || "",
        "Address": item.address || "",
        "Enrollment Fee": item.enrollment || 0,
        "Balance": item.balance || 0,
        "Scholar": item.scholar === true || item.scholar === "YES" ? "YES" : "NO",
        "Paid Status": item.paid === true || item.paid === "Paid" ? "Paid" : "NO"
      }));
    }

    function downloadCSV() {
      const data = getExportData();

      if (data.length === 0) {
        alert("No data available to download!");
        return;
      }

      const headers = Object.keys(data[0]);
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += headers.join(",") + "\n";

      data.forEach(row => {
        csvContent += headers.map(header => {
          const value = String(row[header] ?? "").replace(/"/g, '""');
          return `"${value}"`;
        }).join(",") + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "student_database.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadExcel() {
      const data = getExportData();

      if (data.length === 0) {
        alert("No data available to download!");
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(workbook, worksheet, "Student Data");

      worksheet["!cols"] = [
        { wch: 5 }, { wch: 25 }, { wch: 15 }, { wch: 15 },
        { wch: 12 }, { wch: 30 }, { wch: 15 }, { wch: 12 },
        { wch: 10 }, { wch: 12 }
      ];

      XLSX.writeFile(workbook, "student_database.xlsx");
    }

    window.onload = function() {
      if (sessionStorage.getItem("isLoggedIn") === "true") {
        document.getElementById("loginModal").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        loadStudents();
      } else {
        document.getElementById("loginModal").style.display = "flex";
        document.getElementById("mainApp").style.display = "none";
      }
    };
  </script>
</body>
</html>
